[build-system]
requires = ["setuptools>=68,<82", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "subplz"
version = "2.0.0"
description = "Generate accurate subtitles from audio, align existing subs to videos, generate your own Kindle's Immersion Reading like audiobook subs 📖🎧"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}

# Optional metadata
authors = [{name = "KanjiEater", email = "kanjieat3r@gmail.com"}]
keywords = ["whisper", "subtitles", "align", "generate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# faster_whisper must match a working docker version.
# Python 3.12 can be enabled when stable-ts supports it (when official whisper does)
dependencies = [
    "beautifulsoup4~=4.14.3",
    "biopython~=1.87",
    "EbookLib~=0.20",
    "faster_whisper==1.2.1",
    "ffmpeg_python~=0.2.0",
    "rapidfuzz~=3.14.3",
    "numpy~=1.26.4",
    "regex~=2024.11.6", # Replace blackmagic regex in get_lang and remove
    "wcwidth >= 0.2.13",
    "natsort == 8.4.0",
    "tqdm~=4.67.1",
    "pysbd~=0.3.4",
    "stable-ts~=2.19.1",
    "ctranslate2==4.6.0",
    "stanza~=1.11.1",
    "PyYAML~=6.0.3",
    "lingua-language-detector~=2.1.1",
    "loguru~=0.7.3",
    "pycountry~=26.2.16",
    "watchdog~=6.0.0",
    "setuptools<82.0.0", # Required by ctranslate2 for whisper
    # "ats @ file:///home/ke/code/AudiobookTextSync",
]


[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["*"]    # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)

[tool.setuptools.package-data]
"*" = ["alass-linux64"]

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "ruff==0.15.9",
  "pytest==9.0.2",
  "pytest-cov==7.1.0"
]
anki = [
  "requests==2.26.0",
  "subs2cia@git+https://github.com/kanjieater/subs2cia#egg=de536d1c983641cd590180aa93c080010b1c5665"
]

[project.scripts]
subplz = "subplz.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--verbose"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "ats",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.8
target-version = "py38"

[tool.ruff.format]
docstring-code-format = true
